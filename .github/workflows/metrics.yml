name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: mluizuliana
          template: classic
          base: header, activity, community
          config_timezone: America/Sao_Paulo

          languages: yes
          languages_details: bytes-size, percentage
          languages_limit: 6
