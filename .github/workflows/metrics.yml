name: GitHub Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: mluizuliana
          template: terminal
          base: header, repositories
          config_timezone: America/Sao_Paulo
          filename: stats.svg

  languages:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: mluizuliana
          template: terminal
          base: ""
          languages: yes
          languages_limit: 5
          languages_details: percentage
          filename: languages.svg
